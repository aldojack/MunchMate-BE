spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQL_DATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

#Possibley later change

#show-sql=true vs false
#show-sql=true logs every SQL query to stdout/logs. In dev this is useful for debugging and understanding what Hibernate generates.
#In prod, this is a performance hit (I/O overhead for every query) and can leak sensitive data (passwords, user data) into logs that might be archived or monitored. Set to false in prod.
spring.jpa.show-sql=true

#generate-ddl=true vs false
#generate-ddl=true tells Spring Data JPA to generate DDL from entity mappings.
#In dev, this is convenient for rapid iteration: you change an entity, Hibernate regenerates the schema.
#In prod, you don't want automatic schema generation ? it's unpredictable and risky. You want explicit, versioned migrations (via Flyway, Liquibase, or manual scripts).
spring.jpa.generate-ddl=true

#ddl-auto=update vs validate
#ddl-auto=update automatically applies schema changes at startup. Fine for dev when you're iterating on entities.
#In prod, update can silently modify the schema without your knowledge or control. It can cause data loss (dropped columns, changed types), performance issues, or unexpected downtime. validate checks that the schema matches entities but does NOT modify it ? if there's a mismatch, the app fails to start, which is safer than silent corruption.
#Best practice: use validate or none in prod and manage schema changes explicitly via migrations.

spring.jpa.hibernate.ddl.auto=update